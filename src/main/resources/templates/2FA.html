<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/styleguide.css}">
  <link rel="stylesheet" th:href="@{/css/2FA.css}">
</head>
<body>
<div class="STAFF-FA">
  <div class="div">
    <header class="header">
      <div class="overlap-group">
        <div class="rectangle"></div>
        <img class="img" th:src="@{/img/HEADER.png}" />
        <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
        <div class="text-wrapper-2">Laboratory Staff</div>
      </div>
    </header>
    <div class="element-form">
      <input class="overlap" />
      <div class="two-factor-wrapper"><div class="two-factor">Two-factor Authentication</div></div>
      <p class="to-continue-enter">
        <span class="span">To continue, enter the authentication code sent to your </span>
        <span class="text-wrapper-3">email</span>
        <span class="span">.</span>
      </p>
      <p>
        <input class="input" id="input-1" type="text" placeholder="Authentication Code" />
      </p>
      <button class="button">
        <span class="button-text">Submit</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
