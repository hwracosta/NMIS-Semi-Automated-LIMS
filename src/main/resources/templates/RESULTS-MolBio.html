<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MolBio Results</title>
    <link rel="stylesheet" th:href="@{/css/RESULTS-MolBio.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Include jQuery -->
    <script>
        $(document).ready(function() {
            $('#resultsForm').submit(function(event) {
                event.preventDefault(); // Ensure the default form submission is prevented

                let allFilled = true;

                // Check if all fields are filled
                $('input[type="text"]').each(function() {
                    if ($(this).val() === '') {
                        allFilled = false;
                    }
                });

                if (!allFilled) {
                    alert("Please fill out all fields before submitting.");
                } else {
                    // Submit via AJAX
                    $.ajax({
                        type: 'POST',
                        url: '/submitResults',
                        data: $(this).serialize(),
                        success: function(response) {
                            alert('Results submitted successfully!');
                            window.location.href = "/TR-MolBio"; // Change this URL to the appropriate path
                        },
                        error: function(xhr, status, error) {
                            alert('Error submitting results: ' + error);
                        }
                    });
                }
            });
        });
    </script>
</head>
<body>
<header class="header">
    <div class="overlap-group">
        <div class="rectangle"></div>
        <img class="img" th:src="@{/img/HEADER.png}" alt="Header Image" />
        <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
        <div class="header-links">
            <a href="/STAFF-TESTINGhome" class="text-wrapper-2">Testing Staff Home</a>
            <div class="logout-button">
                <form th:action="@{/logout}" method="get" style="display: inline;">
                    <a href="/STAFF-login" class="log-out">Logout</a>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="content">
    <div class="track-box">
        <h2>Molecular Biology Results</h2>
        <div class="control-number-indicator">
            <h3>LD Control Number: <span th:text="${ldControlNumber}">Control Number</span></h3>
        </div>
        <form id="resultsForm" method="POST" th:action="@{/submitResults}">
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Examination Conducted</th>
                        <th>Meat Species Result</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="examination : ${examinations}">
                        <td th:text="${examination}">Examination Name</td>
                        <td><input type="text" th:name="'species_result_' + ${examination}" required></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <input type="hidden" name="ldControlNumber" th:value="${ldControlNumber}"> <!-- Hidden field for ldControlNumber -->
            <input type="hidden" name="clientReqid" th:value="${clientReqid}"> <!-- Hidden field for clientReqid -->
            <div class="submit-container">
                <button type="submit">Submit Results</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
