<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroBio Results</title>
    <link rel="stylesheet" th:href="@{/css/RESULTS-Microbio.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Include jQuery -->
    <script>
        $(document).ready(function() {
            $('#resultsForm').submit(function(event) {
                event.preventDefault(); // Prevent default form submission
    
                let allFilled = true;
    
                $('input[type="text"], select').each(function() {
                    if (!$(this).hasClass('reference-value') && !$(this).hasClass('remarks') && $(this).val() === '') {
                        allFilled = false;
                    }
                });
    
                if (!allFilled) {
                    alert("Please fill out all required fields before submitting.");
                } else {
                    // Submit via AJAX
                    $.ajax({
                        type: 'POST',
                        url: '/submitMicrobioResults',
                        data: $('#resultsForm').serialize(),
                        success: function(response) {
                            alert('Results submitted successfully!');
                            window.location.href = "/TR-MicroBio"; // Redirect after successful submission
                        },
                        error: function(xhr, status, error) {
                            alert('Error submitting results: ' + error);
                        }
                    });
                }
            });
        });
    </script>    
</head>
<body>
<header class="header">
    <div class="overlap-group">
        <div class="rectangle"></div>
        <img class="img" th:src="@{/img/HEADER.png}" alt="Header Image" />
        <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
        <div class="header-links">
            <a href="/STAFF-TESTINGhome" class="text-wrapper-2">Testing Home</a>
            <div class="logout-button">
                <form th:action="@{/logout}" method="get" style="display: inline;">
                    <a href="/STAFF-login" class="log-out">Logout</a>
                </form>
            </div>
        </div>
    </div>
</header>

<div class="content">
    <div class="track-box">
        <h2>Microbiological Test Results</h2>
        <div class="control-number-indicator">
            <h3>LD Control Number: <span th:text="${ldControlNumber}">Control Number</span></h3>
        </div>
        <form id="resultsForm" method="POST" th:action="@{/submitMicrobioResults}">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>TEST CONDUCTED</th>
                            <th>RESULT</th>
                            <th>REFERENCE VALUE</th>
                            <th>REMARKS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="examination : ${examinations}">
                            <td th:text="${examination}">Test Name</td>
                            <td>
                                <select class="results" th:name="'micResult_' + ${examination}" required>
                                    <option value="" disabled selected>Select Result</option>
                                    <option value="Positive">Positive</option>
                                    <option value="Negative">Negative</option>
                                </select>
                            </td>     
                            <td><input class="reference-value" type="text" th:name="'micRefVal_' + ${examination}" placeholder="Reference Value"></td>
                            <td><input class="remarks" type="text" th:name="'micRemarks_' + ${examination}" placeholder="Remarks"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <input type="hidden" name="ldControlNumber" th:value="${ldControlNumber}"> 
            <input type="hidden" name="clientReqid" th:value="${clientReqid}"> 
            <div class="submit-container">
                <button type="submit">Submit Results</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
