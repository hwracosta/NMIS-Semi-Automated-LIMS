<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Requests</title>
    <link rel="stylesheet" th:href="@{/css/CLIENT-trackreq.css}">
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="path_to_logo.png" alt="National Meat Inspection Service Logo"> <!--fix header-->
        </div>
        <div class="header-text">
            <h1>Republic of the Philippines</h1>
            <h2>Department of Agriculture</h2>
            <h3>National Meat Inspection Service</h3>
            <h4>Client Laboratory Information Management System</h4>
        </div>
    </div>

    <div class="content">
        <div class="track-box">
            <h2>Track Requests</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Sample Code</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Example Rows -->
                        <tr>
                            <td>1234</td>
                            <td>5678</td>
                            <td>Processing</td>
                        </tr>
                        <tr>
                            <td>5678</td>
                            <td>9012</td>
                            <td>Completed</td>
                        </tr>
                        <!-- Add more rows as needed -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
