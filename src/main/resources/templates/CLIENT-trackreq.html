<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Requests</title>
    <link rel="stylesheet" th:href="@{/css/CLIENT-trackreq.css}">
</head>
<body>
    <header class="header">
        <div class="overlap-group">
          <div class="rectangle"></div>
          <img class="img" th:src="@{/img/HEADER.png}" />
          <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
          <div class="text-wrapper-2">Client Track Request</div>
        </div>
    </header>

    <div class="content">
        <div class="track-box">
            <h2>Track Requests</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Sample Code</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Example Rows -->
                        <tr>
                            <td>1234</td>
                            <td>5678</td>
                            <td>Processing</td>
                        </tr>
                        <tr>
                            <td>5678</td>
                            <td>9012</td>
                            <td>Completed</td>
                        </tr>
                        <!-- Add more rows as needed -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
