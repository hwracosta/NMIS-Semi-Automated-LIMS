<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Requests</title>
    <link rel="stylesheet" th:href="@{/css/CLIENT-trackreq.css}">
</head>
<body>
    <header class="header">
        <div class="overlap-group">
          <div class="rectangle"></div>
          <img class="img" th:src="@{/img/HEADER.png}" />
          <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
                <div class="header-links">
                    <a href="/CLIENT-home" class="text-wrapper-2">Client Home</a>
                    <div class="logout-button">
                      <form th:action="@{/logout}" method="get" style="display: inline;">
                        <a href="/client-login" class="log-out">Logout</a>
                      </form>
                    </div>
                </div>                  
        </div>
    </header>

    <div class="content">
        <div class="track-box">
            <h2>Track Requests</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Sample Code</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop through requests and display them dynamically -->
                        <tr th:each="request : ${requests}">
                            <td th:text="${request.clientReqid}"></td>
                            <td th:text="${request.clientSampleCode}"></td>
                            <td th:text="${request.status}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
