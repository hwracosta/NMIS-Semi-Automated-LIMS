<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, content=1.0">
    <title>For Testing (MicroBio)</title>
    <link rel="stylesheet" th:href="@{/css/TESTING-Microbio.css}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="overlap-group">
            <div class="rectangle"></div>
            <img class="img" th:src="@{/img/HEADER.png}" alt="Header Image" />
            <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
            <div class="header-links">
                <a href="/STAFF-TESTINGhome" class="text-wrapper-2">Testing Staff Home</a>
                <div class="logout-button">
                    <form th:action="@{/logout}" method="get" style="display: inline;">
                        <a href="/STAFF-login" class="log-out">Logout</a>
                    </form>
                </div>
            </div>                  
        </div>
    </header>

    <!-- Content Area -->
    <main class="content">
        <div class="request-review-box">
            <h2 class="title">For Testing</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Control Number</th>
                            <th>Sample Details</th>
                            <th>Test Request/s</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${requests}">
                            <td th:text="${request.ldControlNumber}">Control Number</td> 
                            <td>
                                <a href="#" th:onclick="'showSampleDetailsPopup(' + ${request.clientReqid} + ')'">
                                    <u>Sample Details</u>
                                </a>
                            </td>
                            <td>
                                <a href="#" th:data-client-reqid="${request.clientReqid}" th:onclick="'showTestRequestPopup(this.dataset.clientReqid)'">
                                    <u>Test Request/s</u>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="3" style="text-align:center;">No pending requests</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Popup for Test Request Details -->
    <div class="popup" id="testRequestPopup" style="display:none;">
        <div class="popup-content">
            <span class="close-popup" onclick="closeTestRequestPopup()">&times;</span>
            <h3>Test Request Details</h3>
            <div id="testRequestDetails">
                <!-- Dynamic checklist items will be populated here -->
            </div>
        </div>
    </div>

    <!-- Popup for Sample Details -->
    <div class="popup" id="sampleDetailsPopup">
        <div class="popup-content">
            <span class="close-popup" onclick="closeSampleDetailsPopup()">&times;</span>
            <div class="pdf-header">
                <h2>Sample Details</h2>
            </div>
            <hr>
            <div class="pdf-section">
                <h3>Sample Information</h3>
                <table class="pdf-table">
                    <tbody id="sampleDetailsTable">
                        <!-- Rows will be dynamically populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentClientReqId; // Declare a variable to store the current clientReqid

        function showTestRequestPopup(clientReqid) {
            currentClientReqId = clientReqid; // Store the clientReqid for use in submitTestRequest
            // Fetch and populate test request details via AJAX
            $.ajax({
                url: '/api/getMicroBioRequestDetails', // Adjust according to your API
                type: 'GET',
                data: { clientReqid: clientReqid }, // Pass clientReqid
                success: function(data) {
                    $('#testRequestDetails').html(`
                        <form id="testRequestForm">
                            <div class="checklist">${data}</div>
                            <button class="submit-btn" type="button" onclick="submitMicrobioRequest(${clientReqid})">Submit</button>
                        </form>
                    `); // Populate the returned HTML directly
                    restoreCheckboxState(clientReqid); // Use clientReqid to restore state
                    $('#testRequestPopup').fadeIn(); // Show popup
                },
                error: function(xhr, status, error) {
                    alert('Error fetching test request details: ' + error);
                }
            });
        }

        function restoreCheckboxState(clientReqid) {
            const checkboxes = document.querySelectorAll('.checklist input[type="checkbox"]');
            checkboxes.forEach((checkbox) => {
                const testValue = checkbox.value.trim();
                const storageKey = `${clientReqid}_${testValue}`; // Unique key for localStorage
                const storedValue = localStorage.getItem(storageKey); // Use the unique key to get stored state
                checkbox.checked = storedValue === 'true'; // Restore checked state

                // Add change event listener to save state
                checkbox.addEventListener('change', function () {
                    localStorage.setItem(storageKey, this.checked); // Save state in localStorage with the unique key
                });
            });
        }

        function showSampleDetailsPopup(clientReqid) {
            $.ajax({
                url: '/api/getMicroBioSampleDetails',
                type: 'GET',
                data: { clientReqid: clientReqid },
                success: function(data) {
                    console.log("Sample Details Data:", data); // Log data to verify the structure


                    let tableRows = '';


                    const fields = {
                        clientSampleCode: "Sample Code",
                        sampleDetails: "Sample Details",
                        sampleSource: "Sample Source",
                        productionDate: "Production Date",
                        expirationDate: "Expiration Date",
                        samplingDate: "Sampling Date",
                        weightGrams: "Weight (grams)",
                        purposeTest: "Purpose of Test",
                    };


                    for (let field in fields) {
                        if (data[field] !== undefined) {
                            let value = data[field];


                            // Format dates if they are in ISO format (string)
                            if (field.includes("Date") && typeof value === "string") {
                                value = new Date(value).toLocaleDateString();
                            }


                            // Format molecTests as a list if it’s a comma-separated string
                            if (field === 'microbioTests' && value) {
                                value = `<ul>${value.split(',').map(test => `<li>${test.trim()}</li>`).join('')}</ul>`;
                            }


                            tableRows += `
                                <tr>
                                    <td class="pdf-field">${fields[field]}</td>
                                    <td class="pdf-value">${value}</td>
                                </tr>
                            `;
                        }
                    }


                    $('#sampleDetailsTable').html(tableRows);
                    $('#sampleDetailsPopup').fadeIn();
                },
                error: function(xhr, status, error) {
                    alert('Error fetching sample details: ' + error);
                }
            });
        }

        function submitMicrobioRequest(clientReqid) {
            const checkboxes = $('#testRequestForm input[type="checkbox"]');
            const checkedCount = checkboxes.filter(':checked').length;

            if (checkboxes.length !== checkedCount) {
                alert('Please ensure all test requests are checked before submitting.');
                return;
            }

            const formData = $('#testRequestForm').serialize();

            $.ajax({
                url: '/api/submitMicrobioRequest',
                type: 'POST',
                data: { clientReqid: clientReqid, ...formData },
                success: function(response) {
                    alert('Test request submitted successfully!');
                    console.log(response);
                    $('tr:has(a[data-client-reqid="' + clientReqid + '"])').fadeOut(500, function() {
                        $(this).remove();
                    });
                    closeTestRequestPopup();
                },
                error: function(xhr, status, error) {
                    console.log("Error: " + error);
                    alert('Error submitting test request: ' + error);
                }
            });
        }



        function closeTestRequestPopup() {
            $('#testRequestPopup').fadeOut();
        }

        function closeSampleDetailsPopup() {
            $('#sampleDetailsPopup').fadeOut();
        }

        // Close the popup if clicking outside of it
        $(window).click(function(event) {
            if ($(event.target).is('#testRequestPopup')) {
                closeTestRequestPopup();
            }
            if ($(event.target).is('#sampleDetailsPopup')) {
                closeSampleDetailsPopup();
            }
        });
    </script>
</body>
</html>
