<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" th:href="@{/css/globals.css}" />
    <link rel="stylesheet" th:href="@{/css/styleguide.css}" />
    <link rel="stylesheet" th:href="@{/css/STAFF-TESTINGhome.css}" />
</head>
<body>
<div class="STAFF-TESTINGhome">
    <div class="div">
        <header class="header">
            <div class="overlap-group">
                <div class="rectangle"></div>
                <img class="img" th:src="@{/img/HEADER.png}" alt="Header Image" />
                <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
                <div class="header-links">
                    <a href="/STAFF-TESTINGhome" class="text-wrapper-2">Testing Staff Home</a>
                    <div class="logout-button">
                      <form th:action="@{/logout}" method="get" style="display: inline;">
                        <a href="/STAFF-login" class="log-out">Logout</a>
                      </form>
                    </div>
                  </div>                  
            </div>
        </header>
        <div class="buttons-container">
            <a th:href="@{/TESTING-testing}" class="overlap-3">
                <div class="text-wrapper-5">For Testing</div>
                <img class="log" th:src="@{/img/testing-fortesting.png}" />
            </a>
            <a th:href="@{/TESTING-results}" class="overlap">
                <div class="text-wrapper-3">Test Results</div>
                <img class="log" th:src="@{/img/testing-testresults.png}" />
            </a>            
            <a th:href="@{/TESTING-database}" class="overlap-2">
                <div class="text-wrapper-4">Database</div>
                <img class="submit" th:src="@{/img/release-database.png}" />
            </a>        
        </div>
    </div>
</div>
</body>
</html>
