<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" th:href="@{/css/globals.css}" />
  <link rel="stylesheet" th:href="@{/css/styleguide.css}" />
  <link rel="stylesheet" th:href="@{/css/STAFF-2FA.css}" />
</head>
<body>
<div class="STAFF-2FA">
  <div class="div">
    <header class="header">
      <div class="overlap-group">
        <div class="rectangle"></div>
        <img class="img" th:src="@{/img/HEADER.png}" />
        <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
        <div class="text-wrapper-2">Laboratory Staff</div>
      </div>
    </header>
    <div class="element-form">
      <div class="forgot-password-wrapper">
        <div class="forgot-password">Two-Factor Authentication</div>
      </div>
      <p class="fpw-descriptor">
        <span class="span">Enter the email address you used for this account and we’ll</span><br>
        <span class="span">send you a </span>
        <span class="text-wrapper-3">code</span>
        <span class="span">to confirm your request.</span>
      </p>

      <!-- Form to verify 2FA code -->
      <form th:action="@{/STAFF-2FA}" method="post">
        <input class="input" id="input-1" type="text" name="code" placeholder="Enter 2FA Code" required/>
        <input type="hidden" name="email" th:value="${email}" /> <!-- Hidden email field -->
        <button type="submit" class="button">
          <span class="button-text">Submit</span>
        </button>
      </form>

      <!-- Flash messages for feedback -->
      <div th:if="${message}" class="success-message">
        <p th:text="${message}"></p>
      </div>
      <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
