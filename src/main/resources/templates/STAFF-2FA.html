<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" th:href="@{/css/globals.css}">
  <link rel="stylesheet" th:href="@{/css/styleguide.css}">
  <link rel="stylesheet" th:href="@{/css/STAFF-2FA.css}">
</head>
<body>
<div class="STAFF-FA">
  <div class="div">
    <header class="header">
      <div class="overlap-group">
        <div class="rectangle"></div>
        <img class="img" th:src="@{/img/HEADER.png}" />
        <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
        <div class="text-wrapper-2">Laboratory Staff</div>
      </div>
    </header>

    <!-- Form to send 2FA code -->
    <form th:action="@{/STAFF-send-2FA}" method="post">
      <p>Enter your email to receive a 2FA code:</p>
      <input class="input" id="email" type="email" name="email" placeholder="Enter your email" th:value="${email}" required/>
      <button class="button" type="submit">
        <span class="button-text">Send 2FA Code</span>
      </button>
    </form>

    <!-- Form to verify 2FA code -->
    <form th:action="@{/STAFF-verify-2FA}" method="post">
      <p>Enter the 2FA code you received:</p>
      <input class="input" id="input-1" type="text" name="code" placeholder="Authentication Code" required/>
      <input type="hidden" name="email" th:value="${email}" /> <!-- Hidden field to store email -->
      <button class="button" type="submit">
        <span class="button-text">Submit</span>
      </button>
    </form>

    <!-- Display flash messages -->
    <div th:if="${message}" class="success-message">
      <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" class="error-message">
      <p th:text="${error}"></p>
    </div>
  </div>
</div>
</body>
</html>
