<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Review</title>
    <link rel="stylesheet" th:href="@{/css/RELEASE-review.css}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="overlap-group">
            <div class="rectangle"></div>
            <img class="img" th:src="@{/img/HEADER.png}" alt="Header Image" />
            <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
            <div class="header-links">
                <a href="/STAFF-RELEASINGhome" class="text-wrapper-2">Receiving/Releasing Staff Home</a>
                <div class="logout-button">
                  <form th:action="@{/logout}" method="get" style="display: inline;">
                    <a href="/STAFF-login" class="log-out">Logout</a>
                  </form>
                </div>
              </div>                  
        </div>
    </header>

    <!-- Content Area -->
    <main class="content">
        <div class="request-review-box">
            <h2 class="title">Pending Request List</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Client Name</th>
                            <th>Client Details</th>
                            <th>Submission Date</th>
                            <th>Compliance Check Tools</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${requests}">
                            <td th:text="${request.client != null ? request.client.companyName : 'Unknown Client'}">Client Name</td>
                            <td>
                                <a href="#" th:onclick="'showClientDetailsPopup(' + ${request.clientReqid} + ')'">
                                    <u>View Details</u>
                                </a>                                                                         
                            </td>
                            <td th:text="${#dates.format(request.submitDate, 'MM/dd/yyyy')}">Submission Date</td>
                            <td>
                                <form class="status-form" th:action="@{/release/update-status}" method="post">
                                    <input type="hidden" th:name="clientReqid" th:value="${request.clientReqid}" /> 
                                    <select name="status" required>
                                        <option value="" disabled selected>Select an option</option>
                                        <option value="For Testing">For Testing</option>
                                        <option value="Sample/s Rejected">Sample/s Rejected</option>
                                    </select>
                                    <button type="submit" class="submit-btn">Submit</button> 
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="5" style="text-align:center;">No Pending Requests</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Client Details Popup -->
    <div class="popup" id="clientDetailsPopup">
        <div class="popup-content">
            <span class="close-popup" onclick="closeClientDetailsPopup()">&times;</span>
            <div class="pdf-header">
                <h2>Client Details</h2>
            </div>
            <hr>
            <div class="pdf-section">
                <h3>Client and Sample Information</h3>
                <table class="pdf-table">
                    <tbody id="clientDetailsTable">
                        <!-- Client details rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <script>
        $(document).ready(function() {
            // Handle the status form submission
            $('.status-form').on('submit', function(event) {
                event.preventDefault();
    
                var form = $(this); // Reference to the form
                var row = form.closest('tr'); // Get the table row containing this form
    
                $.ajax({
                    url: form.attr('action'),
                    type: 'POST',
                    data: form.serialize(),
                    success: function(response) {
                        // On success, remove the row from the table
                        row.fadeOut(function() {
                            $(this).remove();
                        });
                    },
                    error: function(xhr, status, error) {
                        alert('Error updating status: ' + error);
                    }
                });
            });
        });
    
        function showClientDetailsPopup(clientReqid) {
            // Clear existing data
            $('#clientDetailsTable').empty();
    
            // Fetch the client details based on clientReqid using AJAX
            $.ajax({
                url: '/api/getClientDetails', // Adjust API endpoint as needed
                type: 'GET',
                data: { clientReqid: clientReqid },
                success: function(data) {
                    let tableRows = '';
    
                    const fields = {
                        companyName: "Company Name",
                        contactName: "Client Name",
                        contactEmail: "Contact Email",
                        phoneNumber: "Phone Number",
                        address: "Address",
                        sampleCategory: "Sample Category",
                        sampleCode: "Sample Code",
                        sampleSource: "Sample Source",
                        sampleDetails: "Sample Details",
                        productionDate: "Production Date",
                        expirationDate: "Expiration Date",
                        samplingDate: "Sampling Date",
                        weightGrams: "Weight (grams)",
                        purposeTest: "Purpose of Test",
                        microbioTests: "Microbiological Tests",
                        molecTests: "Molecular Biology Tests",
                        chemTests: "Chemistry Tests",
                    };
    
                    for (let field in fields) {
                        if (data[field] !== undefined) {
                            tableRows += `
                                <tr>
                                    <td class="pdf-field">${fields[field]}</td>
                                    <td class="pdf-value">${data[field]}</td>
                                </tr>
                            `;
                        }
                    }
    
                    $('#clientDetailsTable').html(tableRows);
                    $('#clientDetailsPopup').fadeIn();
                },
                error: function(xhr, status, error) {
                    alert('Error fetching client details: ' + error);
                }
            });
        }
    
        function closeClientDetailsPopup() {
            $('#clientDetailsPopup').fadeOut();
        }
    
        // Close the popup if clicking outside of it
        $(window).click(function(event) {
            if ($(event.target).is('#clientDetailsPopup')) {
                closeClientDetailsPopup();
            }
        });
    </script>    
</body>
</html>
