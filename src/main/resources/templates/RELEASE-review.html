<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Review</title>
    <link rel="stylesheet" th:href="@{/css/RELEASE-review.css}">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="overlap-group">
          <div class="rectangle"></div>
          <img class="img" th:src="@{/img/HEADER.png}" />
          <div class="text-wrapper">LABORATORY INFORMATION MANAGEMENT SYSTEM</div>
          <div class="text-wrapper-2">Receiving/Releasing Staff</div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="content">
        <div class="request-review-box">
            <h2 class="title">Pending Request List</h2>
            <!-- Display messages -->
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Client Name</th>
                            <th>Client Details</th>
                            <th>Submission Date</th>
                            <th>Compliance Check Tools</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${requests}">
                            <td th:text="${request.client != null ? request.client.companyName : 'Unknown Client'}">Client Name</td>
                            <td>
                                <a th:href="@{/client/details/{id}(id=${request.client.clientId})}">
                                    <u>View Details</u>
                                </a>
                            </td>
                            <td th:text="${#dates.format(request.submitDate, 'MM/dd/yyyy')}">Submission Date</td>
                            <td>
                                <form th:action="@{/release/update-status}" method="post">
                                    <input type="hidden" th:name="clientReqid" th:value="${request.clientReqid}" />  <!-- Correct property reference -->
                                    <select name="status" required>
                                        <option value="" disabled selected>Select an option</option>
                                        <option value="For Testing">For Testing</option>
                                        <option value="Sample/s Rejected">Sample/s Rejected</option>
                                    </select>
                                    <button type="submit" class="submit-btn">Submit</button>
                                </form>                                
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="5" style="text-align:center;">No pending requests</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
